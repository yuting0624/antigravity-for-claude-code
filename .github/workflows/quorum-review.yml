# Second reviewer: Gemini and Claude read the diff independently, on ONE Google
# Cloud credential (https://github.com/yuting0624/quorum-review).
#
# WHY a second one, next to claude-review.yml. That workflow is a single Opus
# scan with a prompt full of this repository's own contracts (exit codes,
# AGY_SIGNAL/AGY_USAGE, version sync, the delegate bash gate). It is good at
# drift and at things only this repo cares about. What it cannot do is exceed
# one model's recall: a second opinion only ever sees findings that were already
# reported, so a bug the scan walked past is never put in front of it. Two
# independent scans is the only arrangement that raises the ceiling. They are
# meant to be complementary — if this one starts repeating claude-review, narrow
# that one's prompt rather than deleting this.
#
# NO LONG-LIVED SECRET. The GitHub OIDC token is exchanged for short-lived Google
# Cloud credentials via Direct Workload Identity Federation, and both Gemini and
# Claude authenticate off those same ADC. `WIF_PROVIDER` and
# `GOOGLE_CLOUD_PROJECT` name an identity; they are not credentials.
#
# Setup: docs/setup-vertex.md in the quorum-review repository. The step people
# skip is enabling Claude in Vertex AI Model Garden — miss it and every Claude
# call returns 404 while the Gemini half keeps working.

name: quorum-review

on:
  # `synchronize` is on now. Without it this only ever saw the FIRST push, which
  # made it look worse than it is: on #39 it reviewed fb18145 and every later
  # commit — including the fixes it might have had something to say about — went
  # only to the other reviewer. `incremental: on` (the default) means a re-review
  # reads the range since the last one, so a push costs roughly its own size.
  pull_request:
    types: [opened, reopened, synchronize]
  # `@quorum /review` on a pull request runs it on demand in the meantime.
  issue_comment:
    types: [created]
  # Replying "@quorum wontfix" to a review comment retires that finding.
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

# One review at a time per pull request — two runs racing to edit the same summary
# comment can lose the ledger the other just wrote.
#
# `cancel-in-progress` is evaluated BEFORE any job condition, so a run that will be
# skipped still enters the group. Bare `true` therefore made the review cancel ITSELF
# when it posted its summary (#42), and every ordinary human comment cancel the review
# of the push it was replying to (#53).
#
# Two attempts at fixing that tried to predict, in this expression, whether the job
# would actually run — first excluding bots, then excluding comments without a command.
# Both stayed BROADER than the job's `if:` (no author_association, no issue-vs-PR check,
# `@quorum` and `/review` matched separately rather than adjacent), so a run that gets
# skipped could still kill a live one. Chasing that means duplicating the job condition
# here and keeping two copies in sync.
#
# It does not need predicting. `cancel-in-progress: false` does not DISCARD the new run,
# it queues it as pending and starts it when the current one finishes. So the only case
# where cancelling is right is the one where the running review is genuinely obsolete:
# a new push. Everything else — comments, manual dispatch — can simply wait its turn,
# and a run that turns out to be skippable costs a few seconds of a queue slot.
#
# One rule, nothing to keep in sync, and it subsumes both #42 and #53.
concurrency:
  group: >-
    quorum-review-${{ github.event.pull_request.number
      || github.event.issue.number
      || github.event.inputs.pr }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write        # mints the OIDC token; federation fails without it
  pull-requests: write
  security-events: write # SARIF upload only
  actions: read          # codeql-action needs this to read the run

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.fork != true &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@quorum') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                 github.event.comment.author_association)) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        (contains(github.event.comment.body, '@quorum /criteria') ||
         (contains(github.event.comment.body, '@quorum /review') &&
          github.event.issue.state == 'open')) &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                 github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Every action here is pinned to a commit rather than a tag. A tag can be
    # moved to point at new code, and this job holds an App installation token
    # and live Google Cloud credentials — the reason quorum-review's own fork
    # example gives for pinning applies to every step that runs beside it, not
    # just to quorum-review itself. Dependabot bumps them.
    steps:
      # `if:` above cannot exclude a fork on every trigger, and reads as though
      # it does: `github.event.pull_request` exists on `pull_request` and
      # `pull_request_review_comment` and nowhere else, so on `issue_comment`
      # and `workflow_dispatch` the field is null and `null != true` passes.
      #
      # This runs BEFORE the checkout and before any credential is minted, so a
      # fork never reaches the runner. Adopted from upstream's example rather
      # than kept as the separate gating job we had: `needs.<job>.result !=
      # 'failure'` also passes for `cancelled`, and a step has no such state to
      # get wrong. The action re-resolves fork-ness itself as a backstop.
      #
      # `pull-requests: read` is required and is covered by the `write` this job
      # already holds. In a job scoped to `contents: read` it would 403 — and a
      # local `gh` session will not reproduce that, which is how we shipped
      # exactly that bug once already.
      #
      # Reviewing a fork on purpose is claude-review-external.yml's trust model
      # (pull_request_target + a label whose applier is checked), not this one.
      - name: Refuse a fork
        if: >-
          github.event_name == 'issue_comment' ||
          github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.inputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          case "${NUMBER:-}" in
            ''|*[!0-9]*) echo "::error::no usable pull request number (got '${NUMBER:-}')"; exit 1 ;;
          esac
          head="$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.head.repo.full_name')"
          echo "PR #$NUMBER head repo: $head"
          if [ "$head" != "$REPO" ]; then
            echo "::error title=Not reviewed::#$NUMBER comes from $head. Reviewing a fork needs the label-gated claude-review-external.yml, which isolates the untrusted tree; this workflow does not."
            exit 1
          fi

      # The checkout is what the models read beyond the diff. `fetch-depth: 2`
      # keeps the head commit in the clone, which is how the reviewer confirms
      # at run time that it is reading the right tree; without it the tools are
      # withdrawn and the review silently degrades to diff-only.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        id: merge-ref
        continue-on-error: true
        with:
          ref: >-
            refs/pull/${{ github.event.pull_request.number
              || github.event.issue.number
              || github.event.inputs.pr }}/merge
          fetch-depth: 2
          persist-credentials: false

      # `/merge` does not exist for a conflicted or closed pull request; `/head`
      # does, and reviewing a conflicted branch is still worth doing.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: steps.merge-ref.outcome == 'failure'
        with:
          ref: >-
            refs/pull/${{ github.event.pull_request.number
              || github.event.issue.number
              || github.event.inputs.pr }}/head
          fetch-depth: 1
          persist-credentials: false

      # Comments arrive as the "Quorum Code Review" App rather than
      # github-actions[bot]. The token is minted per run and expires with it;
      # the App holds metadata:read, contents:read, pull_requests:write and no
      # webhook, so there is no listener and nothing that can push a commit.
      #
      # NOTE: `permissions:` above governs GITHUB_TOKEN only. Everything the
      # reviewer does against the API uses this token instead, so its ceiling is
      # the App installation's permissions, not the block above. Checkout and the
      # SARIF upload still use GITHUB_TOKEN.
      - name: Mint an App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2
        with:
          app-id: ${{ vars.QUORUM_APP_ID }}
          private-key: ${{ secrets.QUORUM_APP_PRIVATE_KEY }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}

      - name: Review
        uses: yuting0624/quorum-review@9d3edce31cd14696f5d27c1413b4503bc62878e3  # v1.7.0
        with:
          mode: vertex
          google-cloud-project: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          # Was a built-in, unmodified, while this ran against a known answer key
          # (#40) — a skill written to match that key would have found it by
          # construction. That measurement is done, and keeping the generic skill
          # now just means running a worse reviewer on real pull requests: the
          # built-ins are tuned for application code and this repository is bash
          # and markdown.
          #
          # Written from the contracts this repo already documents, NOT from what
          # this reviewer previously missed — fitting it to past misses would make
          # any later recall number meaningless. Deliberately not a copy of
          # claude-review.yml's prompt either: two reviewers reading the same
          # words are not two independent reads.
          skill: .github/quorum/plugin-review.md
          # MEASURED, not copied from the docs: `claude-sonnet-5` is served in
          # `global` and returns FAILED_PRECONDITION ("not servable in region")
          # in us-central1 for this project. Both models are pinned to the same
          # region so the code does not fan out across jurisdictions.
          vertex-region: global
          claude-vertex-region: global
          gemini-location: global
          github-token: ${{ steps.app-token.outputs.token }}
          pr-number: ${{ github.event.inputs.pr }}
          sarif-file: quorum.sarif
          # Advisory while on trial. Make it a required check (`fail-on: critical`)
          # only after its precision on this repository is known.

      # Public repository, so code scanning is free. `continue-on-error` because
      # a red check for a repository feature nobody bought gets the whole
      # workflow deleted; the findings are on the PR and in the job summary too.
      - name: Upload to code scanning
        if: always() && hashFiles('quorum.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3  # v3.37.4
        with:
          sarif_file: quorum.sarif
          category: quorum-review
